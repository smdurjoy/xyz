version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - lb-network

  app1:
    image: node:20-alpine
    container_name: app1
    working_dir: /app
    command: sh -c "npm init -y && npm install express && node server.js"
    volumes:
      - ./server.js:/app/server.js
    expose:
      - "3000"
    networks:
      - lb-network

  app2:
    image: node:20-alpine
    container_name: app2
    working_dir: /app
    command: sh -c "npm init -y && npm install express && node server.js"
    volumes:
      - ./server.js:/app/server.js
    expose:
      - "3000"
    networks:
      - lb-network

  app3:
    image: node:20-alpine
    container_name: app3
    working_dir: /app
    command: sh -c "npm init -y && npm install express && node server.js"
    volumes:
      - ./server.js:/app/server.js
    expose:
      - "3000"
    networks:
      - lb-network

networks:
  lb-network:
    driver: bridge
