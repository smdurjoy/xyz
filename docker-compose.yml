version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - lb-network

  app1:
    build: .
    container_name: app1
    expose:
      - "3000"
    depends_on:
      - redis
    networks:
      - lb-network

  app2:
    build: .
    container_name: app2
    expose:
      - "3000"
    depends_on:
      - redis
    networks:
      - lb-network

  app3:
    build: .
    container_name: app3
    expose:
      - "3000"
    depends_on:
      - redis
    networks:
      - lb-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - lb-network

networks:
  lb-network:
    driver: bridge
